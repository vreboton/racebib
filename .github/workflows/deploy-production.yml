name: deploy-production-manual
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Source SHA of an immutable published RaceBib release
        required: true
      release_tag:
        description: Optional explicit immutable recovery tag for this source SHA
        required: false
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: racebib-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 80
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify immutable manifest, source, attempts and both publishing jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          SOURCE: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 -B deploy/scripts/release.py verify "$SOURCE" --release-tag "$RELEASE_TAG"
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
          role-session-name: racebib-${{ github.run_id }}-${{ github.run_attempt }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
      - name: Invoke restricted SSM document and await terminal result
        env:
          SOURCE: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          DOCUMENT_NAME: RaceBib-DeployVerifiedRelease
        run: python3 -B deploy/scripts/ssm_deploy.py
      - name: Verify public HTTPS health
        run: |
          set -euo pipefail
          status=$(curl --fail --silent --show-error --proto '=https' --max-time 30 --output /dev/null --write-out '%{http_code}' https://racebib.vreboton.com/health)
          test "$status" = 200
      - name: Report outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Deployment job: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect the SSM command and host state before retrying a failure. Cancellation or timeout does not prove the remote command stopped. Never clear a maintenance barrier or auto-rollback.' >> "$GITHUB_STEP_SUMMARY"
