name: deploy-production-manual
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Source SHA of an immutable published RaceBib release
        required: true
      release_tag:
        description: Optional explicit immutable recovery tag for this source SHA
        required: false
      migrate:
        description: Apply reviewed migrations after backup (cannot override a recovery barrier)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: racebib-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify immutable manifest, source, attempts and both publishing jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          SOURCE: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 -B deploy/scripts/release.py verify "$SOURCE" --release-tag "$RELEASE_TAG"
      - name: Deploy through dedicated forced-command SSH identity
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SOURCE: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MIGRATE: ${{ inputs.migrate }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/racebib
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/racebib' EXIT
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "$RELEASE_TAG" || "$RELEASE_TAG" =~ ^racebib-$SOURCE-recovery-[1-9][0-9]*-[1-9][0-9]*$ ]]
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ && "$USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          option=''
          if [[ "$MIGRATE" == true ]]; then option=' --migrate'; fi
          if [[ -n "$RELEASE_TAG" ]]; then option+=" --release-tag $RELEASE_TAG"; fi
          # The root-owned server independently fetches/verifies the manifest again.
          ssh -i ~/.ssh/racebib -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$USER@$HOST" "deploy $SOURCE$option"
